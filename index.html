<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#121110" />
    <meta name="color-scheme" content="dark" />
    <script>
      (function () {
        var themes = ["ember", "ink", "harbor", "velvet", "pine", "obsidian"];
        try {
          var saved = localStorage.getItem("noise-theme");
          if (themes.indexOf(saved) >= 0) document.documentElement.dataset.theme = saved;
        } catch (_) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Noise" />
    <meta name="description" content="White, brown, pink i ventilator noise — offline PWA" />
    <title>Noise</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css?v=15" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <p class="brand">noise</p>
        <div class="top-actions">
          <button type="button" class="install" id="install" hidden>Install</button>
          <div class="gear-wrap">
            <button
              type="button"
              class="icon-btn"
              id="gear-btn"
              aria-label="Podešavanja"
              aria-expanded="false"
              aria-haspopup="true"
            >
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l-.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
            </button>
            <div id="gear-menu" class="gear-menu" hidden>
              <p class="gear-menu-label">Tema</p>
              <div id="theme-swatches" class="theme-swatches" role="radiogroup" aria-label="Tema"></div>
            </div>
          </div>
        </div>
      </header>

      <section class="types" aria-label="Vrsta šuma">
        <button type="button" class="type is-on" data-type="white">
          <span class="type-name">White</span>
          <span class="type-hint">ravno</span>
        </button>
        <button type="button" class="type" data-type="brown">
          <span class="type-name">Brown</span>
          <span class="type-hint">duboko</span>
        </button>
        <button type="button" class="type" data-type="pink">
          <span class="type-name">Pink</span>
          <span class="type-hint">meko</span>
        </button>
        <button type="button" class="type" data-type="fan">
          <span class="type-name">Fan</span>
          <span class="type-hint">ventilator</span>
        </button>
        <button type="button" class="type" data-type="soft">
          <span class="type-name">Soft</span>
          <span class="type-hint">plafon</span>
        </button>
        <button type="button" class="type" data-type="ac">
          <span class="type-name">AC</span>
          <span class="type-hint">klima</span>
        </button>
      </section>

      <section class="deck">
        <div class="clock-wrap">
          <div class="clock-bar" id="clock-bar"></div>
          <p class="clock" id="clock" aria-live="polite">12:00:00</p>
        </div>
        <div class="controls">
          <button type="button" class="ctrl add" id="add" aria-label="+1h">
            <img src="./icons/plus.png" alt="" class="ctrl-icon" />
          </button>
          <button type="button" class="ctrl play is-on" id="play" aria-label="Play">
            <img src="./icons/play.png" alt="" class="ctrl-icon" id="play-icon" />
          </button>
          <button type="button" class="ctrl stop" id="stop" aria-label="Stop">
            <img src="./icons/stop.png" alt="" class="ctrl-icon" />
          </button>
        </div>
      </section>
    </div>
    <script src="./app.js?v=16" type="module"></script>
  </body>
</html>
